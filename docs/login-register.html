<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="image/Logo.jpg" type="image/x icon">
    <link rel="stylesheet" href="css/login-register.css">
    <title>Login / Register - CakeSite</title>
</head>
<body>
    <div class="login-container">
        <!-- login-form -->
        <h2 id="form-title">Sign in to CakeSite</h2>
        <form id="login-form">
            <label for="login-username">Username</label>
            <input type="text" id="login-username" name="username" required />

            <label for="login-password">Password</label>
            <input type="password" id="login-password" name="password" required />

            <button type="submit">Sign in</button>
        </form>

        <!-- register-form -->
        <form id="register-form" class="hidden">
            <label for="register-username">Username</label>
            <input type="text" id="register-username" name="username" required />

            <label for="register-email">Email</label>
            <input type="email" id="register-email" name="email" required />

            <label for="register-password">Password</label>
            <input type="password" id="register-password" name="password" required />

            <button type="submit">Register</button>
        </form>

        <p class="toggle-link">
            <span class="toggle-text">New to CakeSite?</span>
            <button class="login-link" id="toggle-btn">Create an account</button>
        </p>
    </div>
    <script src="js/login-register.js" defer></script>
</body>
</html>
